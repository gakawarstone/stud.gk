name: Linux desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2t64 xvfb
          npm ci
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm test
      - run: npm run dist:linux
      - name: Smoke test packaged desktop app
        env:
          CAMPUS_SMOKE_ENTRY: ${{ github.workspace }}/release/linux-unpacked/resources/app.asar/electron/main.cjs
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: campus-linux-x64
          path: |
            release/Campus-*.AppImage
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Campus $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release/Campus-*.AppImage --clobber
