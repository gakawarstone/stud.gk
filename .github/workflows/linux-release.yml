name: Linux desktop release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2t64 xvfb
          npm ci
      - name: Set release version
        id: release
        run: |
          base_version="$(node -p 'require("./package.json").version')"
          version="${base_version}-build.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: npm test
      - name: Build AppImage
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run dist:linux -- --config.extraMetadata.version="$RELEASE_VERSION"
      - name: Smoke test packaged desktop app
        env:
          CAMPUS_SMOKE_ENTRY: ${{ github.workspace }}/release/linux-unpacked/resources/app.asar/electron/main.cjs
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: stud-gk-linux-x64
          if-no-files-found: error
          path: |
            release/Stud.GK-*.AppImage
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Stud.GK $RELEASE_TAG" --generate-notes --draft
          fi
          gh release upload "$RELEASE_TAG" release/Stud.GK-*.AppImage --clobber
          # An older build must not replace the latest release after a newer push.
          latest=false
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')" = "$GITHUB_SHA" ]; then
            latest=true
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
