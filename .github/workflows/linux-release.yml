name: Linux desktop release
run-name: Release Stud.GK ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v, for example 0.0.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  linux:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate release version
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a version like 0.0.1, without v or a suffix."
            exit 1
          fi
          tag="v$RELEASE_VERSION"
          existing_tag="$(git ls-remote --tags origin "refs/tags/$tag")"
          if [ -n "$existing_tag" ]; then
            echo "::error::Tag $tag already exists. Choose a new release version."
            exit 1
          fi
          npm version "$RELEASE_VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2t64 xvfb
          npm ci
      - run: npm test
      - name: Build AppImage
        run: npm run dist:linux
      - name: Smoke test packaged desktop app
        env:
          CAMPUS_SMOKE_ENTRY: ${{ github.workspace }}/release/linux-unpacked/resources/app.asar/electron/main.cjs
        run: xvfb-run -a npm run test:desktop -- --no-sandbox
      - name: Launch AppImage executable
        run: xvfb-run -a node scripts/appimage-smoke.cjs release/Stud.GK-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: stud-gk-${{ inputs.version }}-linux-x64
          if-no-files-found: error
          path: |
            release/Stud.GK-*.AppImage
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release/Stud.GK-*.AppImage \
            --target "$GITHUB_SHA" \
            --title "Stud.GK $RELEASE_TAG" \
            --generate-notes \
            --latest
