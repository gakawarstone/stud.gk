name: Pull request checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check desktop navigation and file previews
        run: xvfb-run -a npm run test:desktop -- --no-sandbox --ozone-platform=x11
      - name: Check GitLab integration
        run: xvfb-run -a npm run test:gitlab -- --no-sandbox --ozone-platform=x11
      - name: Check session expiry and slow polling
        run: xvfb-run -a npm run test:session -- --no-sandbox --ozone-platform=x11
      - name: Check reactive lists and PDF viewer
        run: xvfb-run -a npm run test:ui -- --no-sandbox --ozone-platform=x11
      - name: Check course file search
        run: xvfb-run -a --server-args='-screen 0 1920x1200x24' npm run test:search -- --no-sandbox --ozone-platform=x11
